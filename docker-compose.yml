services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ticketbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD privately for local Compose}
      POSTGRES_DB: tickets
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ticketbot -d tickets']
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build: .
    env_file: .env
    command: ['npm', 'run', 'migrate:deploy']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
volumes:
  postgres_data:
