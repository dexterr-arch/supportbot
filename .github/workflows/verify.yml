name: Verify
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ticketbot
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: tickets_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U ticketbot -d tickets_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ticketbot:ci-test-password@localhost:5432/tickets_test
      TEST_DATABASE_URL: postgresql://ticketbot:ci-test-password@localhost:5432/tickets_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: npm run migrate:deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:all
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: docker build -t support-ticket-bot:ci .
